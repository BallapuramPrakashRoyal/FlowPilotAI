name: FlowPilot AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Tests, Migrations & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependency Vulnerability Check
        run: |
          cd backend
          pip install pip-audit || true
          pip-audit --desc || echo "Dependency audit completed."

      - name: Verify Alembic Migrations
        env:
          DATABASE_URL: sqlite+aiosqlite:///flowpilot_ci.db
          SYNC_DATABASE_URL: sqlite:///flowpilot_ci.db
          SECRET_KEY: test_secret_key_minimum_32_characters_long_for_ci
          CREDENTIAL_ENCRYPTION_KEY: dGhpc19pc19hXzMyX2J5dGVfc2VjcmV0X2tleV9mb3JfZGV2IQ==
        run: |
          alembic -c alembic.ini current
          alembic -c alembic.ini upgrade head

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite+aiosqlite:///flowpilot_ci.db
          SYNC_DATABASE_URL: sqlite:///flowpilot_ci.db
          SECRET_KEY: test_secret_key_minimum_32_characters_long_for_ci
          CREDENTIAL_ENCRYPTION_KEY: dGhpc19pc19hXzMyX2J5dGVfc2VjcmV0X2tleV9mb3JfZGV2IQ==
        run: |
          cd backend
          pytest -v

  frontend-checks:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Compile Production Build
        run: |
          cd frontend
          npm run build

  docker-build-verification:
    name: Docker Compose Validation & Build
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Images (Dry Run)
        run: |
          docker compose build --pull
